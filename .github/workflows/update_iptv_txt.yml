name: IPTVTXT Update Workflow

on:
  schedule:
    - cron: '0 19 * * *'  # 比 update_iptv.yml 晚1小时，避免同时执行导致git冲突
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn

jobs:
  update-iptv-txt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 授予写入内容的权限
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout代码
      uses: actions/checkout@v5
      with:
        repository: wangchongzhq/TZY
        persist-credentials: true  # 保持凭据以便推送

    - name: 设置Python环境
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行IPTVTXT脚本
      run: |
        python IPTVTXT.py --update

    - name: 检查文件变更
      id: check_changes
      run: |
        git add jieguo_txt.m3u jieguo_txt.txt
        git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT

    - name: 提交更新
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        # 配置git身份和行为
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions Bot"
        git config --local core.autocrlf false  # 防止行尾字符转换问题
        
        echo "=== 开始Git操作 ==="
        echo "当前分支: $(git branch --show-current)"
        
        # 直接从已运行的脚本结果提交（不再重复执行脚本）
        echo "添加更改的文件..."
        git add jieguo_txt.m3u jieguo_txt.txt
        
        # 提交更改
        echo "提交更改..."
        git commit -m "自动更新IPTVTXT频道列表 [$(date +'%Y-%m-%d %H:%M:%S')]"
        
        # 先拉取远程更新再推送，避免冲突
        echo "同步远程并推送..."
        git pull --rebase origin ${{ github.ref_name }} || true
        git push origin ${{ github.ref_name }} || {
          echo "推送失败，尝试使用--force-with-lease推送..."
          git push --force-with-lease origin ${{ github.ref_name }} || {
            echo "::error::推送失败，请检查GitHub权限配置"
            exit 1
          }
        }
