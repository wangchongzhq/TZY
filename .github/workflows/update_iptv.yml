name: IPTV Update Workflow

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout代码
      uses: actions/checkout@v5
      with:
        repository: wangchongzhq/TZY
        persist-credentials: true

    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 提交更新
      run: |
        # 配置git身份和行为
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions Bot"
        git config --global pull.rebase false
        git config --global core.autocrlf false
        
        echo "=== 开始Git操作 ==="
        echo "当前分支: $(git branch --show-current)"
        
        # 同步本地与远程仓库
        echo "同步本地与远程仓库..."
        git remote -v
        git fetch origin ${{ github.ref_name }}
        git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }}
        git reset --hard origin/${{ github.ref_name }}
        
        echo "本地仓库已重置为远程最新状态"
        
        # 执行脚本生成最新文件
        echo "执行脚本生成最新文件..."
        python IPTV.py --update
        
        # 检查文件是否存在
        if [ ! -f "jieguo.m3u" ] && [ ! -f "jieguo.txt" ]; then
          echo "::error::错误：未找到任何生成的文件"
          exit 1
        fi
        
        # 添加文件
        echo "添加更改的文件..."
        git add jieguo.m3u jieguo.txt
        
        # 检查是否有更改
        if git diff --staged --quiet; then
          echo "没有检测到更改，跳过提交"
          exit 0
        fi
        
        # 提交更改
        echo "提交更改..."
        git commit -m "自动更新IPTV频道列表 [$(date +'%Y-%m-%d %H:%M:%S')]"
        
        # 推送到远程仓库
        echo "尝试推送更改到远程仓库..."
        git push origin ${{ github.ref_name }} || {
          echo "推送失败，尝试使用--force-with-lease推送..."
          git push --force-with-lease origin ${{ github.ref_name }} || {
            echo "--force-with-lease推送失败，最后尝试使用--force推送..."
            git push --force origin ${{ github.ref_name }}
          }
        }
